<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 56" width="250" height="56" role="img" aria-label="HR Attendance">
  <defs>
    <linearGradient id="hraGradW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Mark: rounded badge + clock ring + check = time confirmed -->
  <rect x="6" y="6" width="44" height="44" rx="13" fill="url(#hraGradW)"/>
  <circle cx="28" cy="28" r="13.5" fill="none" stroke="#0b1220" stroke-opacity="0.35" stroke-width="2.4"/>
  <path d="M20.5 28.6 l5 5 L37 21.5" fill="none" stroke="#0b1220" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wordmark (light text for dark backgrounds) -->
  <text x="66" y="37" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#ffffff" letter-spacing="-0.5">HR</text>
  <text x="108" y="37" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#cbd5e1" letter-spacing="-0.5">Attendance</text>
</svg>
