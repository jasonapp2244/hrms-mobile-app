<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 56" width="250" height="56" role="img" aria-label="Employment Management Portal">
  <defs>
    <linearGradient id="hraGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#f26522"/>
    </linearGradient>
  </defs>
  <!-- Mark: rounded badge + clock ring + check = time confirmed -->
  <rect x="6" y="6" width="44" height="44" rx="13" fill="url(#hraGrad)"/>
  <circle cx="28" cy="28" r="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="2.4"/>
  <path d="M20.5 28.6 l5 5 L37 21.5" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wordmark -->
  <text x="66" y="31" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#111827" letter-spacing="-0.5">EMP</text>
  <text x="66" y="45" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="10.5" font-weight="600" fill="#f26522" letter-spacing="0.2">Employment Management Portal</text>
</svg>
